    {
      "rule_id": "BLK-COM-SINGLE-WAIT-001",
      "category": "blackout",
      "subcondition": "single_or_clustered_uncertain_blackout",
      "required_facts": [
        "blackout.episodes_separated_by_24h_count",
        "blackout.mechanism_status",
        "blackout.occurred",
        "blackout.years_since_last_event"
      ],
      "condition": {
        "all": [
          {
            "field": "blackout.episodes_separated_by_24h_count",
            "operator": "==",
            "value": 1
          },
          {
            "field": "blackout.years_since_last_event",
            "operator": "<",
            "value": 5
          }
        ]
      },
      "outcome": {
        "assessment_outcome": "temporarily_unfit",
        "route": "rag_review",
        "requires_human_review": true,
        "minimum_event_free_period_years": 5
      },
      "reason_template": "The five-year event-free period for a single or 24-hour-clustered uncertain blackout has not elapsed.",
      "rag_query_key": "blackout_uncertain_single_commercial",
      "module": "blackout",
      "source_ids": [
        "AFTD2022-BLK-COM-004"
      ],
      "automation_status": "pending_clinical_review",
      "gate": {
        "all": [
          {
            "field": "blackout.occurred",
            "operator": "==",
            "value": true
          },
          {
            "field": "blackout.mechanism_status",
            "operator": "==",
            "value": "undetermined_after_investigation"
          }
        ]
      }
    },
    {
