<text x="88" y="712" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#445c73">Apply applicability gates, risk rules and missing-data requirements.</text>
<text x="88" y="736" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#356bd5">Deterministic YAML predicates · validated JSON contracts</text>
