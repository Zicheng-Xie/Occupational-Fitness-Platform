<text x="68" y="310" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#356bd5">01</text>
<text x="111" y="310" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#234e9e">CASE INTAKE &amp; RED FLAG</text>
<text x="68" y="338" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a82">Understand the record; evaluate explicit rule requirements.</text>
<text x="782" y="310" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b8b73">02</text>
<text x="825" y="310" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#086b59">EVIDENCE &amp; TRACEABLE REPORTS</text>
<text x="782" y="338" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a82">Retrieve original guidance; make every conclusion inspectable.</text>
