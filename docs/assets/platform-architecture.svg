<text x="66" y="935" font-size="18" fill="#14243c" font-weight="400">Ten retrieval routes: vector / lexical / hybrid / graph / reranking / tree + fixed-input model judgments</text>
<text x="66" y="959" font-size="16" fill="#526278" font-weight="400">evaluation/ · tools/ · configs/experiments/ · outputs/experiments/  |  Experimental rankings retain separate artifacts</text>
