<text x="86" y="655" font-size="16" fill="#526278" font-weight="400">YAML predicates · applicability gates · missing data</text>
<text x="86" y="677" font-size="16" fill="#526278" font-weight="400">Public rule result + request-scoped RAGInput</text>
<text x="86" y="699" font-size="16" fill="#526278" font-weight="400">rules/ · red_flag.py · schemas/</text>
<rect x="740" y="322" width="594" height="112" rx="14" fill="#ffffff" stroke="#dce4f0"/>
