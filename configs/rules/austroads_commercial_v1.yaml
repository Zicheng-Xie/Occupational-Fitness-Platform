      "source_ids": [
        "AFTD2022-BLK-COM-005"
      ],
      "automation_status": "pending_clinical_review",
      "gate": {
        "all": [
          {
            "field": "blackout.occurred",
            "operator": "==",
            "value": true
          },
          {
            "field": "blackout.mechanism_status",
            "operator": "==",
            "value": "undetermined_after_investigation"
          }
        ]
      }
    },
    {
      "rule_id": "BLK-COM-CONDITIONAL-ELIGIBILITY-001",
      "category": "blackout",
      "subcondition": "uncertain_blackout_conditional_eligibility",
      "required_facts": [
        "blackout.appropriate_specialist_information_available",
        "blackout.episodes_separated_by_24h_count",
        "blackout.mechanism_status",
        "blackout.occurred",
        "blackout.years_since_last_event"
      ],
      "condition": {
        "any": [
          {
            "all": [
              {
                "field": "blackout.episodes_separated_by_24h_count",
                "operator": "==",
                "value": 1
              },
              {
                "field": "blackout.years_since_last_event",
                "operator": ">=",
                "value": 5
              },
              {
                "field": "blackout.appropriate_specialist_information_available",
                "operator": "==",
                "value": true
              }
            ]
          },
          {
            "all": [
              {
                "field": "blackout.episodes_separated_by_24h_count",
                "operator": ">=",
                "value": 2
              },
              {
                "field": "blackout.years_since_last_event",
                "operator": ">=",
                "value": 10
              },
              {
                "field": "blackout.appropriate_specialist_information_available",
                "operator": "==",
                "value": true
              }
            ]
          }
        ]
      },
      "outcome": {
