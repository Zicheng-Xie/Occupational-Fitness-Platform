<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Occupational Fitness Platform — engineering architecture</title>
<desc id="desc">Two connected modules: case intake and deterministic Red Flag evaluation; guideline evidence retrieval and traceable reporting. The diagram maps processing stages to technologies and source directories, including exact binding and hybrid RAG branches.</desc>
<rect width="1440" height="1120" rx="24" fill="#f5f7fb"/>

<rect x="32" y="28" width="1376" height="112" rx="20" fill="#152a43" stroke="none"/>
<text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#aac5e5">OCCUPATIONAL FITNESS PLATFORM</text>
<text x="60" y="99" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Two modules. One traceable assessment workflow.</text>
<text x="60" y="123" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#c5d5e7">Local case understanding → deterministic rules → original guideline evidence → reviewable draft</text>
