<rect x="740" y="460" width="594" height="112" rx="14" fill="#ffffff" stroke="#dce4f0"/>
<rect x="740" y="460" width="5" height="112" rx="2" fill="#0c947b" stroke="none"/>
<text x="760" y="490" font-size="21" fill="#14243c" font-weight="600">Exact binding or semantic RAG</text>
<text x="760" y="517" font-size="16" fill="#526278" font-weight="400">Fast path → exact binding; other cases select mode</text>
<text x="760" y="539" font-size="16" fill="#526278" font-weight="400">Chroma · nomic-embed-text · BM25 · RRF</text>
<text x="760" y="561" font-size="16" fill="#526278" font-weight="400">retrieval/ · indexing/ · pipeline/austroads_rag.py</text>
