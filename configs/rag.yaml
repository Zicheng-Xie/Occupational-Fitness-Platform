# Legacy v0.2 experimental retrieval configuration. Main workflow: workflow.yaml.
source:
  name: "Austroads Assessing Fitness to Drive"
  version: "AP-G56-22"
  jurisdiction: "Australia"
  default_licence_context: "commercial"

pilot_modules:
  - hypertension
  - ischemic_heart_disease
  - vision
  - hearing
  - blackout
  - diabetes

index:
  provider: "chroma"
  persist_directory: "data/chroma_db"
  collection_name: "austroads_commercial"

retrieval:
  candidate_k: 20
  bm25_k: 30
  top_k: 5
  use_bm25: true
  rrf_k: 60
  reranker: "none"        # none | cross_encoder
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_filtered_documents: 2000

routing:
  retrieve_on_routes:
    - rag_review
    - human_review
  missing_info_policy: "short_circuit"   # short_circuit | retrieve_requirements

chunking:
  max_chars: 1800
  overlap_chars: 180
  heading_size_ratio: 1.15

annotations_file: "configs/austroads_annotations.yaml"
