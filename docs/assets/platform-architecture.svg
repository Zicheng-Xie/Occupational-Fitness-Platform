<text x="760" y="379" font-size="16" fill="#526278" font-weight="400">Austroads AP-G56-22 · original PDF + source IDs</text>
<text x="760" y="401" font-size="16" fill="#526278" font-weight="400">Page / section / bounding box / text fingerprints</text>
<text x="760" y="423" font-size="16" fill="#526278" font-weight="400">data/knowledge/ · configs/source_anchors.json</text>
