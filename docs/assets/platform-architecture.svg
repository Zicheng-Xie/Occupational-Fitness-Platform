<text x="66" y="193" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b8097">ENTRY / LOCAL WORKSPACE</text>
<text x="66" y="220" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#172b45">Browser · FastAPI · Uvicorn</text>
<text x="482" y="193" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b8097">ACCEPTED INPUT</text>
<text x="482" y="220" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#172b45">TXT / Markdown / text-layer PDF / clinical forms</text>
