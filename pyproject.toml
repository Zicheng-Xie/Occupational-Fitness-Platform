[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occupational-fitness-platform"
version = "0.4.0"
description = "Traceable five-module Austroads commercial-driver assessment workflow"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0,<2", "ollama>=0.6,<1"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
fitness-rag = "occupational_fitness_rag.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["external", "useless can delete", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
