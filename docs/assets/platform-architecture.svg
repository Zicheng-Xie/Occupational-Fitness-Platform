<text x="92" y="404" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="128" y="405" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#172b45">Extract &amp; ground facts</text>
<text x="88" y="432" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#445c73">Keep quotations, offsets, units, conflicts and unknown values.</text>
<text x="88" y="456" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#356bd5">Qwen3 14B / Ollama · PyMuPDF · Pydantic</text>
