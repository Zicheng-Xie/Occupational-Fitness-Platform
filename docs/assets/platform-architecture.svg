<text x="760" y="655" font-size="16" fill="#526278" font-weight="400">Case quotes + guideline citations + review checklist</text>
<text x="760" y="677" font-size="16" fill="#526278" font-weight="400">HTML / Markdown / JSON · SHA-256 audit chain</text>
