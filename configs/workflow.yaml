schema_version: '1.2.0'
project_root: '..'
rules: configs/rules/austroads_commercial_v1.yaml
anchors: configs/source_anchors.json
catalogue: data/knowledge/processed/source_catalogue.json
output_directory: outputs/runs
retrieval:
  # exact | hybrid_local (lexical cosine + BM25/RRF) | chroma
  mode: chroma
  top_k: 5
  candidate_k: 20
  collection_name: aftd_commercial_v1_1
  persist_directory: data/knowledge/indexes/chroma
  # Chroma uses Ollama embeddings configured explicitly, not an implicit download.
  embedding_model: nomic-embed-text
  ollama_url: http://127.0.0.1:11434
llm:
  enabled: true
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:14b
  # Local Ollama manifest: Qwen3 14.8B, GGUF Q4_K_M.
  model_digest: bdbd181c33f2ed1b31c972991882db3cf4d192569092138a7d29e973cd9debe8
  timeout_seconds: 120
  # Keep the production path to one Qwen call: the final Top-K judgment below.
  # Intake and Red Flag evaluation remain deterministic and auditable.
  extraction_enabled: false
  semantic_review_enabled: false
  # Deterministic rules select the route after grounded extraction and semantic review.
  route_classification_enabled: false
  # Evidence selection is deterministic; Qwen is reserved for the final judgment.
  evidence_classification_enabled: false
  narrative_enabled: false
  context_length: 8192
  max_output_tokens: 768
  max_input_chars: 10000
  extraction_chunk_chars: 6000
  extraction_chunk_overlap: 400
  think: false
