  "rules": [
    {
      "rule_id": "HTN-COM-UNCONDITIONAL-001",
      "category": "cardiovascular",
      "subcondition": "hypertension",
      "required_facts": [
        "cardiovascular.blood_pressure.persistent_diastolic",
        "cardiovascular.blood_pressure.persistent_systolic"
      ],
      "condition": {
        "any": [
          {
            "field": "cardiovascular.blood_pressure.persistent_systolic",
            "operator": ">",
            "value": 170,
            "unit": "mmHg"
          },
          {
            "field": "cardiovascular.blood_pressure.persistent_diastolic",
            "operator": ">",
            "value": 100,
            "unit": "mmHg"
          }
        ]
      },
      "outcome": {
        "assessment_outcome": "may_meet_conditional_standard",
        "route": "rag_review",
        "requires_human_review": true
      },
      "reason_template": "Persistent blood pressure exceeds the commercial unconditional-licence threshold.",
      "rag_query_key": "hypertension_commercial_unconditional",
      "module": "hypertension",
      "source_ids": [
        "AFTD2022-HTN-COM-001"
      ],
      "automation_status": "pending_clinical_review",
      "gate": null
    },
    {
      "rule_id": "HTN-COM-CONDITIONAL-001",
      "category": "cardiovascular",
      "subcondition": "hypertension_conditional",
      "required_facts": [
        "cardiovascular.hypertension.antihypertensive_therapy",
        "cardiovascular.hypertension.controlled_for_4_weeks",
        "cardiovascular.hypertension.driving_impairing_medication_side_effects",
        "cardiovascular.hypertension.initial_specialist_information_available",
        "cardiovascular.hypertension.target_organ_damage_relevant_to_driving"
      ],
      "condition": {
        "all": [
          {
            "field": "cardiovascular.hypertension.antihypertensive_therapy",
            "operator": "==",
            "value": true
          },
          {
            "field": "cardiovascular.hypertension.controlled_for_4_weeks",
            "operator": "==",
            "value": true
          },
          {
            "field": "cardiovascular.hypertension.driving_impairing_medication_side_effects",
            "operator": "==",
            "value": false
          },
          {
            "field": "cardiovascular.hypertension.target_organ_damage_relevant_to_driving",
            "operator": "==",
            "value": false
          },
          {
            "field": "cardiovascular.hypertension.initial_specialist_information_available",
            "operator": "==",
            "value": true
          }
        ]
      },
      "outcome": {
        "assessment_outcome": "may_meet_conditional_standard",
        "route": "rag_review",
        "requires_human_review": true,
        "review_interval": "annual"
      },
      "reason_template": "The recorded facts satisfy the tabulated clinical criteria for consideration of a conditional licence; licensing-authority review is still required.",
      "rag_query_key": "hypertension_commercial_conditional",
      "module": "hypertension",
      "source_ids": [
        "AFTD2022-HTN-COM-002"
      ],
      "automation_status": "pending_clinical_review",
      "gate": {
        "all": [
          {
            "triggered_rule": "HTN-COM-UNCONDITIONAL-001"
          }
        ]
      }
    },
    {
      "rule_id": "BLK-COM-UNDIAGNOSED-001",
      "category": "blackout",
      "subcondition": "blackout_mechanism_not_yet_ascertained",
      "required_facts": [
        "blackout.mechanism_status",
        "blackout.occurred"
      ],
      "condition": {
        "all": [
          {
            "field": "blackout.occurred",
            "operator": "==",
            "value": true
          },
          {
            "field": "blackout.mechanism_status",
            "operator": "in",
            "value": [
              "not_investigated",
              "under_investigation"
            ]
          }
        ]
      },
      "outcome": {
        "assessment_outcome": "temporarily_unfit",
        "route": "rag_review",
        "requires_human_review": true
      },
      "reason_template": "A blackout has occurred and its mechanism has not yet been ascertained.",
      "rag_query_key": "blackout_diagnostic_workup_commercial",
      "module": "blackout",
      "source_ids": [
        "AFTD2022-BLK-COM-001"
      ],
      "automation_status": "pending_clinical_review",
      "gate": {
        "all": [
          {
            "field": "blackout.occurred",
            "operator": "==",
            "value": true
          }
        ]
      }
    },
    {
