<text x="86" y="490" font-size="21" fill="#14243c" font-weight="600">Independent semantic review</text>
<text x="86" y="517" font-size="16" fill="#526278" font-weight="400">Re-read original notes; quarantine uncertain facts</text>
<text x="86" y="539" font-size="16" fill="#526278" font-weight="400">Unknown or conflicting fields remain explicit</text>
<text x="86" y="561" font-size="16" fill="#526278" font-weight="400">case_intake/semantic_review.py</text>
<path d="M360 572V596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="66" y="598" width="594" height="112" rx="14" fill="#ffffff" stroke="#dce4f0"/>
