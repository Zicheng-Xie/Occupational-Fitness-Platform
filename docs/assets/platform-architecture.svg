<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
<title id="title">Occupational Fitness Platform: two-module engineering architecture</title>
<desc id="desc">Local browser and API intake feeds grounded extraction, semantic review and deterministic Red Flag rules. Request-scoped facts feed exact guideline binding or hybrid RAG, then traceable draft reports and clinician review. Isolated research compares ten retrieval routes and model judgments.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="1100" rx="24" fill="#f4f7fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#14243c">

<text x="44" y="45" font-size="15" fill="#526278" font-weight="700">OCCUPATIONAL FITNESS PLATFORM</text>
<text x="44" y="86" font-size="32" fill="#14243c" font-weight="700">From clinical notes to traceable evidence</text>
<text x="44" y="116" font-size="18" fill="#526278" font-weight="400">Two core modules · Five assessment domains · Local model services · Auditable outputs</text>
<rect x="44" y="144" width="1312" height="68" rx="14" fill="#14243c" stroke="none"/>
<text x="66" y="173" font-size="14" fill="#93c5fd" font-weight="700">LOCAL WORKSPACE</text>
<text x="66" y="197" font-size="18" fill="#ffffff" font-weight="400">Browser / FastAPI / Uvicorn</text>
<text x="430" y="173" font-size="14" fill="#93c5fd" font-weight="700">INPUT</text>
<text x="430" y="197" font-size="18" fill="#ffffff" font-weight="400">TXT · Markdown · text-layer PDF · clinical forms</text>
<text x="1010" y="173" font-size="14" fill="#93c5fd" font-weight="700">ENTRY POINTS</text>
<text x="1010" y="197" font-size="17" fill="#ffffff" font-weight="400">web/ · api.py · commands.py</text>
<rect x="44" y="240" width="638" height="476" rx="14" fill="#eaf1ff" stroke="#cbdcf9"/>
<rect x="718" y="240" width="638" height="476" rx="14" fill="#e6f5f1" stroke="#b9ded2"/>
<text x="66" y="274" font-size="22" fill="#235cc8" font-weight="700">01  CASE INTAKE &amp; RED FLAG</text>
<text x="66" y="300" font-size="17" fill="#526278" font-weight="400">Ground facts, preserve uncertainty, execute rules</text>
<text x="740" y="274" font-size="22" fill="#087d68" font-weight="700">02  GUIDELINE EVIDENCE &amp; REPORTING</text>
<text x="740" y="300" font-size="17" fill="#526278" font-weight="400">Bind original sources, retrieve context, assemble drafts</text>
<path d="M350 212V225H54V378H64" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="66" y="322" width="594" height="112" rx="14" fill="#ffffff" stroke="#dce4f0"/>
<rect x="66" y="322" width="5" height="112" rx="2" fill="#3875e9" stroke="none"/>
<text x="86" y="352" font-size="21" fill="#14243c" font-weight="600">Extract &amp; validate patient facts</text>
<text x="86" y="379" font-size="16" fill="#526278" font-weight="400">Ollama · Qwen3 14B · PyMuPDF · Pydantic</text>
<text x="86" y="401" font-size="16" fill="#526278" font-weight="400">Exact quotations / offsets / types / units / conflicts</text>
<text x="86" y="423" font-size="16" fill="#526278" font-weight="400">case_intake/ · llm.py</text>
