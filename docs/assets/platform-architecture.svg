<text x="66" y="828" font-size="21" fill="#14243c" font-weight="600">Hypertension / cardiovascular   ·   Vision   ·   Hearing   ·   Blackout   ·   Diabetes</text>
<rect x="44" y="874" width="1312" height="100" rx="14" fill="#f0edfc" stroke="#d8d0f1"/>
